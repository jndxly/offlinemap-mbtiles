<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>矢量地图 · MapLibre + 多 MBTiles 自适应路由</title>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; font-family: "Microsoft YaHei", system-ui, sans-serif; }
        #map { position: absolute; inset: 0; }
        .panel {
            position: absolute; top: 16px; left: 16px; z-index: 10;
            width: 320px; padding: 14px 16px;
            background: rgba(24, 28, 36, .84); color: #e8ecf2;
            border: 1px solid rgba(255, 255, 255, .12); border-radius: 12px;
            backdrop-filter: blur(10px); box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
        }
        .panel h1 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
        .panel .hint { margin: 0 0 10px; font-size: 12px; line-height: 1.6; color: #a9b4c4; }
        select {
            width: 100%; padding: 6px 8px; margin-bottom: 10px;
            background: #1f2530; color: #e8ecf2; border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 6px; font-size: 13px;
        }
        .kv { display: flex; gap: 8px; font-size: 12px; margin-bottom: 4px; }
        .kv span:first-child { color: #8e9aab; min-width: 82px; }
        .kv span:last-child { font-family: Consolas, monospace; }
        .tag { color: #ffd479; }
        .log { margin-top: 10px; border-top: 1px solid rgba(255, 255, 255, .12); padding-top: 8px; }
        .log .title { font-size: 12px; color: #8e9aab; margin-bottom: 6px; }
        .log ul { list-style: none; margin: 0; padding: 0; max-height: 120px; overflow: auto; }
        .log li { font-size: 11px; font-family: Consolas, monospace; color: #7fd6a5; line-height: 1.7; }
    </style>
</head>
<body>
<div id="map"></div>

<div class="panel">
    <h1>多 MBTiles 自适应路由</h1>
    <p class="hint">服务端按瓦片 z/x/y 反算经纬度范围，与每个 mbtiles 的 bounds 求交，自动选择应查询的库；首选库无数据时回退到其它库。</p>

    <select id="dataset">
        <option value="">自动路由（按位置选库）</option>
    </select>

    <div class="kv"><span>缩放级别</span><span id="zoom">-</span></div>
    <div class="kv"><span>中心点</span><span id="center">-</span></div>
    <div class="kv"><span>当前瓦片</span><span id="tile">-</span></div>
    <div class="kv"><span>命中数据集</span><span id="hit" class="tag">-</span></div>
    <div class="kv"><span>候选数据集</span><span id="candidates">-</span></div>
    <div class="kv"><span>叠加数据集</span><span id="overlay">-</span></div>
    <div class="kv"><span>官方边界</span><span id="boundary" class="tag">-</span></div>
    <div class="kv"><span>瓦片请求</span><span id="count">0</span></div>

    <div class="log">
        <div class="title">最近瓦片请求</div>
        <ul id="logs"></ul>
    </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
    let tileCount = 0;
    const logsEl = document.getElementById('logs');
    const countEl = document.getElementById('count');
    const hitEl = document.getElementById('hit');
    const candEl = document.getElementById('candidates');
    const tileEl = document.getElementById('tile');
    const selectEl = document.getElementById('dataset');

    const pushLog = (url) => {
        tileCount++;
        countEl.textContent = tileCount;
        const li = document.createElement('li');
        li.textContent = url.replace(location.origin, '');
        logsEl.prepend(li);
        while (logsEl.children.length > 8) logsEl.lastChild.remove();
    };

    // 经纬度 -> 瓦片号（XYZ）
    const lonLatToTile = (lon, lat, z) => {
        const n = 2 ** z;
        const x = Math.floor((lon + 180) / 360 * n);
        const rad = lat * Math.PI / 180;
        const y = Math.floor((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n);
        return {x, y};
    };

    // 查询服务端路由结果：这个瓦片会命中哪个 mbtiles
    const refreshRoute = async () => {
        const z = Math.min(14, Math.floor(map.getZoom()));
        const c = map.getCenter();
        const {x, y} = lonLatToTile(c.lng, c.lat, z);
        tileEl.textContent = `${z}/${x}/${y}`;
        try {
            const res = await fetch(`/route?z=${z}&x=${x}&y=${y}`);
            const data = await res.json();
            candEl.textContent = (data.candidates || [])
                .map(it => `${it.label}(${it.coverage})`).join(' > ') || '无';
            hitEl.textContent = data.dataset || '无数据(204)';
        } catch (e) {
            hitEl.textContent = '-';
        }
    };

    const map = new maplibregl.Map({
        container: 'map',
        style: '/style.json',
        center: [104.110749, 33.964980],
        zoom: 3.5,
        minZoom: 0,
        maxZoom: 14,
        hash: false,
        transformRequest: (url, resourceType) => {
            if (resourceType === 'Tile') pushLog(url);
            return {url};
        }
    });

    map.addControl(new maplibregl.NavigationControl({visualizePitch: false}), 'top-right');
    map.addControl(new maplibregl.ScaleControl({unit: 'metric'}), 'bottom-left');

    const refresh = () => {
        const c = map.getCenter();
        document.getElementById('zoom').textContent = map.getZoom().toFixed(2);
        document.getElementById('center').textContent = c.lng.toFixed(4) + ', ' + c.lat.toFixed(4);
    };
    map.on('load', () => {
        refresh();
        refreshRoute();
    });
    map.on('moveend', () => {
        refresh();
        refreshRoute();
    });

    // 数据集下拉：由 /datasets.json 动态生成
    fetch('/datasets.json')
        .then(r => r.json())
        .then(data => {
            document.getElementById('overlay').textContent = data.overlayDataset || '未启用';
            document.getElementById('boundary').textContent = data.boundaryAvailable
                ? '已加载（海岸线/岛屿可用）' : '缺失（无海岸线，见 README）';
            (data.datasets || []).forEach(ds => {
                const option = document.createElement('option');
                option.value = ds.name;
                option.textContent = `仅用 ${ds.label}（${ds.file}）`;
                selectEl.appendChild(option);
            });
        });

    // 切换数据源：重新加载对应 style（auto 或指定数据集）
    selectEl.addEventListener('change', () => {
        const value = selectEl.value;
        map.setStyle(value ? `/style.json?dataset=${value}` : '/style.json');
    });
</script>
</body>
</html>
